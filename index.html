
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>The Battle Cats</title>
     
     <style>
header{
background-color: rgb(115, 176, 255);
max-width: 800px;
margin: 0 auto;
text-align: center;
-webkit-text-fill-color: rgb(255, 0, 0);
text-decoration-color: aliceblue;

border: 4px solid black;


}
.container { padding: 15px 40px;font-size: 20px;display:grid; align-items:center; grid-template-columns: 1fr 1fr; column-gap: 1px; }
.animation {

color: white;
padding: 15px 30px;
font-size: 160px;
border: none;

cursor: pointer;
transition:transform 0.3s ease;

}
  .image-container {
    position: relative;
    width: 300px;
    height: 250px;
  scale: 0.5;
 cursor: pointer;
  }

  .image-container img {
    position: absolute;
    width: 70%;
    height: 100%;
    opacity: 0;
    transition:opacity  0s;
  }
  .image-container img:nth-child(1) {
    opacity: 1;
  }
  .image-container:hover img:nth-child(1) {
    opacity: 0;
  transition-delay: 1s; 

  }
  .image-container:hover img:nth-child(2) {
    opacity: 1;
    transition-delay: 0s; 
  }
  .image-container:hover img:nth-child(3) {
    opacity: 1;
   transition-delay: 0.3s; 

  }
 .image-container:hover img:nth-child(4) {
    opacity: 1;
  transition-delay: 0.7s; 

  }
.animation:hover {
 
transform: scale(1.5);
}
.left {
 display: block;
  margin-left: 0;
  margin-right: auto;
 
}
main{


max-width: 800px;
margin: 0 auto;
text-align: center;
}
body {
background-color: rgb(184, 142, 78);
border: 2px solid black;
}
img {

border: 2px solid black;
}
</style>
</head>

    <body>
    
 <header> 
 
 <h1>The Battle Cats</h1>
 <img src="asset/images.jpeg" alt="Logo de jogo"  ></src>
  
</header>

      <main>

  <div class=container>          
    
    <img src="asset/game.webp" alt="Batalha" class="left" width="350px"></src>
   <p>The Battle Cats é um jogo para celular que ficou popular no Japão, sendo criado pela empresa PONOS.
     Um jogo com base em defender sua torre contra inimigos, usando principalmente gatos para combater contra varios tipos de inimigos. 
   </p>
 <img src="asset/cat.png" width=100px class="animation"></src>
 <div class="image-container">
  <img src="asset/MetalCatsp.1.png" alt="First Image">
  <img src="asset/MetalCatsp.2.png" alt="Second Image">
  <img src="asset/MetalCatsp.3.png" alt="Third Image">
    <img src="asset/MetalCatsp.4.png" alt="Fourt Image">
</div>
</div>

   
      </main>
   </body>
</html>
